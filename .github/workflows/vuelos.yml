name: Agente de vuelos CDMX → Madrid

on:
  schedule:
    # GitHub descarta la mayoría de los disparos programados, así que en vez de
    # depender de ellos, CADA corrida vigila durante casi una hora seguida.
    # Con que se cumpla un disparo de vez en cuando, la cobertura es continua.
    - cron: "7 * * * *"
  workflow_dispatch:       # botón para correrlo a mano
    inputs:
      forzar_correo:
        description: "Mandar el reporte por correo aunque no haya novedades"
        type: boolean
        default: false

concurrency:
  # Los turnos de vigilancia no deben pisarse entre sí, pero un envío de prueba
  # a mano no tiene por qué esperar 50 minutos a que termine el turno en curso:
  # por eso va en su propio carril.
  group: agente-${{ inputs.forzar_correo == true && 'prueba' || 'vigilancia' }}
  cancel-in-progress: false

permissions:
  contents: write          # para guardar el historial de precios en el repo

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar vuelos y avisar por correo
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          if [ "${{ inputs.forzar_correo }}" = "true" ]; then
            python agent.py --force-email
          else
            python agent.py --loop-minutes 50
          fi

      - name: Guardar historial de precios
        if: always()
        run: |
          git config user.name  "agente-vuelos"
          git config user.email "actions@github.com"
          git add -f data/state.json data/history.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "precios $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash && git push
